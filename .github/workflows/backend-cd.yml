# .github/workflows/backend-cd.yml

name: Backend CD

# main 브랜치에 푸시가 발생하고, backend 폴더에 변경 사항이 있을 때만 실행됩니다.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

# 워크플로우에서 사용할 환경 변수입니다.
# GCP 리전, 서비스 이름 등은 본인의 환경에 맞게 수정해주세요.
env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: asia-northeast3 # 예: 서울 리전
  SERVICE_NAME: kis-invest-backend
  REPOSITORY_NAME: kis-invest-repo # Artifact Registry 저장소 이름

jobs:
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # Dockerfile을 사용하여 이미지 빌드
      - name: Build Docker image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --file backend/Dockerfile ./backend

      # Artifact Registry에 이미지 푸시
      - name: Push Docker image
        run: docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # Cloud Run에 새 리비전 배포
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --quiet \
            --port 8080 \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="KIS_APP_KEY=${{ secrets.KIS_APP_KEY }}" \
            --set-env-vars="KIS_APP_SECRET=${{ secrets.KIS_APP_SECRET }}" \
            --set-env-vars="KIS_ACCOUNT_NO=${{ secrets.KIS_ACCOUNT_NO }}" \
            --allow-unauthenticated
