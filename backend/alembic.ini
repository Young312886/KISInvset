# Alembic migration configuration file
# For details: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Migration script location
script_location = alembic

# Migration file name format (including timestamp)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# PostgreSQL connection URL - placeholder as it's read from .env
# Overridden in env.py to use settings.DATABASE_URL
sqlalchemy.url = postgresql://user:password@localhost/kis_invest

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
