# Alembic 마이그레이션 환경 설정 파일
# 자세한 내용: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# 마이그레이션 스크립트가 저장될 경로
script_location = alembic

# 마이그레이션 파일 이름 형식 (타임스탬프 포함)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# PostgreSQL 연결 URL - .env에서 읽어오므로 여기서는 placeholder
# env.py에서 settings.DATABASE_URL을 사용하도록 오버라이드합니다.
sqlalchemy.url = postgresql://user:password@localhost/kis_invest

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
